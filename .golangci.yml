version: "2"

# Deliberately broad repository-wide limits include tests and existing fixtures.
# Gate on the linter exit status, not issue counts, line numbers, or Git history.
linters:
  default: none
  enable:
    - funlen
    - gocognit
    - lll
  settings:
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 35
    lll:
      line-length: 180
  exclusions:
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
