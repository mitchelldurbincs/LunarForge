name: LunarForge

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lunarforge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install LunarForge
        run: go install github.com/mitchelldurbincs/lunarforge/cmd/lf@latest
      - name: Verify
        run: lf verify --json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lunarforge-evidence
          path: .lf/runs/**
