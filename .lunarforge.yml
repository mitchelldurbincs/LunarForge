version: 1

project:
  name: lunarforge

# LunarForge gating itself. `lf verify` here runs the same ritual CI runs, so
# the local gate and the remote backup cannot drift.
verify:
  commands:
    - id: verify
      run: ./scripts/verify.sh

explain:
  agent: claude
  command: claude
  args:
    - --print
    - --permission-mode
    - plan

evidence:
  dir: .lf/runs
  require_fresh_diff: true
